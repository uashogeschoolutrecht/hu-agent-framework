name: Validate framework

on:
  pull_request:
  push:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill frontmatter and hidden Unicode
        run: python3 .github/validate_skills.py
      - name: Validate university knowledge catalog
        run: python3 .github/validate_knowledge.py
